solana_mobile_dapp_publisher_portal:
  google_store_package: ''
  testing_instructions: Open the app. Basic mode — adjust SOL holdings, DCA, years, and withdrawal sliders to see projections (tap values to type exact numbers). Switch to Advanced mode for full planning. In Advanced GROW tab — configure growth model (CAGR/Power Law/S-Curve), enable Monte Carlo, set DCA frequency, connect wallet to import balances. Click Execute Plan to activate monitoring. SPEND tab — see drawdown simulations from Grow results. MONITOR tab — view DCA schedule, funding status, and progress. LEADERBOARD tab — connect Seeker Vault wallet (.skr), join the leaderboard, score auto-updates every hour. Connect wallet via Seed Vault (choose Seed Vault when wallet chooser appears — uses native MWA). Close and reopen the app to verify wallet connection persists. Test biometric lock by backgrounding and reopening.
