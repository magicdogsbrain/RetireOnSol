<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="growChart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14F195"/>
      <stop offset="100%" style="stop-color:#9945FF"/>
    </linearGradient>
    <linearGradient id="spendChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945FF"/>
      <stop offset="30%" style="stop-color:#14F195"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9945FF"/>
      <stop offset="100%" style="stop-color:#14F195"/>
    </linearGradient>
    <linearGradient id="mcBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14F195;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#14F195;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#14F195;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="rgba(153,69,255,0.1)" stroke-width="1">
    <line x1="100" y1="80" x2="100" y2="520"/>
    <line x1="200" y1="80" x2="200" y2="520"/>
    <line x1="300" y1="80" x2="300" y2="520"/>
    <line x1="400" y1="80" x2="400" y2="520"/>
    <line x1="500" y1="80" x2="500" y2="520"/>
    <line x1="60" y1="160" x2="540" y2="160"/>
    <line x1="60" y1="260" x2="540" y2="260"/>
    <line x1="60" y1="360" x2="540" y2="360"/>
    <line x1="60" y1="460" x2="540" y2="460"/>
  </g>

  <!-- GROW PHASE - Left side chart -->
  <!-- Monte Carlo band (90% confidence) -->
  <path d="M 80 450 Q 140 445 180 420 T 280 340 T 380 220 T 480 120
           L 480 160 T 380 280 T 280 380 T 180 440 Q 140 455 80 460 Z"
        fill="url(#mcBand)"/>

  <!-- Individual MC simulation paths (faded) -->
  <path d="M 80 455 Q 150 440 200 400 T 320 260 T 440 100"
        fill="none" stroke="#14F195" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M 80 448 Q 160 435 210 380 T 340 230 T 460 130"
        fill="none" stroke="#9945FF" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M 80 458 Q 145 450 190 430 T 300 330 T 420 180"
        fill="none" stroke="#14F195" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Main growth curve (median) -->
  <path d="M 80 452 Q 150 440 200 410 T 320 280 T 440 140"
        fill="none"
        stroke="url(#growChart)"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Area fill under median curve -->
  <path d="M 80 452 Q 150 440 200 410 T 320 280 T 440 140 L 440 480 L 80 480 Z"
        fill="url(#growChart)"
        opacity="0.15"/>

  <!-- GROW label -->
  <rect x="70" y="85" width="80" height="30" rx="15" fill="rgba(20,241,149,0.2)" stroke="#14F195" stroke-width="1"/>
  <text x="110" y="106" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#14F195" text-anchor="middle">GROW</text>

  <!-- Transition line -->
  <line x1="480" y1="80" x2="480" y2="520" stroke="#9945FF" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="480" y="70" font-family="Arial, sans-serif" font-size="12" fill="#9945FF" text-anchor="middle">Retirement</text>

  <!-- SPEND PHASE - Middle chart -->
  <!-- Monte Carlo bands for drawdown -->
  <path d="M 480 140 Q 520 135 550 145 T 620 180 T 680 260 T 730 360
           L 730 300 T 680 210 T 620 150 T 550 135 Q 520 130 480 135 Z"
        fill="rgba(20,241,149,0.15)"/>

  <!-- Failed path (red) -->
  <path d="M 480 142 Q 530 160 570 230 T 640 380 T 700 500"
        fill="none" stroke="#FF6B6B" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Successful path (green, declining but surviving) -->
  <path d="M 480 138 Q 540 145 580 180 T 660 280 T 730 330"
        fill="none" stroke="#14F195" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Main drawdown curve (median) -->
  <path d="M 480 140 Q 530 150 570 190 T 650 300 T 720 380"
        fill="none"
        stroke="url(#spendChart)"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- SPEND label -->
  <rect x="490" y="85" width="80" height="30" rx="15" fill="rgba(153,69,255,0.2)" stroke="#9945FF" stroke-width="1"/>
  <text x="530" y="106" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9945FF" text-anchor="middle">SPEND</text>

  <!-- Peak value indicator -->
  <circle cx="440" cy="140" r="8" fill="#14F195"/>
  <line x1="440" y1="148" x2="440" y2="180" stroke="#14F195" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="198" font-family="Arial, sans-serif" font-size="11" fill="#14F195" text-anchor="middle">Peak</text>

  <!-- Success rate indicator -->
  <rect x="660" y="400" width="70" height="50" rx="8" fill="rgba(20,241,149,0.2)" stroke="#14F195" stroke-width="1"/>
  <text x="695" y="425" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#14F195" text-anchor="middle">94%</text>
  <text x="695" y="442" font-family="Arial, sans-serif" font-size="10" fill="#888" text-anchor="middle">Success</text>

  <!-- Right side content panel -->
  <rect x="760" y="60" width="400" height="480" rx="20" fill="rgba(26,26,26,0.8)" stroke="rgba(153,69,255,0.3)" stroke-width="1"/>

  <!-- App Logo and Name -->
  <circle cx="850" cy="130" r="40" fill="url(#accent)"/>
  <text x="850" y="148" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="white" text-anchor="middle">$</text>

  <text x="960" y="120" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" text-anchor="start">RetireOn</text>
  <text x="960" y="160" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#accent)" text-anchor="start">Sol</text>

  <!-- Tagline -->
  <text x="960" y="200" font-family="Arial, sans-serif" font-size="16" fill="#888888" text-anchor="middle">Plan. Grow. Retire.</text>

  <!-- Feature cards -->
  <!-- Monte Carlo -->
  <rect x="785" y="235" width="170" height="70" rx="12" fill="rgba(153,69,255,0.15)" stroke="#9945FF" stroke-width="1"/>
  <text x="870" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9945FF" text-anchor="middle">Monte Carlo</text>
  <text x="870" y="287" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">500+ Simulations</text>

  <!-- Growth Models -->
  <rect x="965" y="235" width="170" height="70" rx="12" fill="rgba(20,241,149,0.15)" stroke="#14F195" stroke-width="1"/>
  <text x="1050" y="265" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14F195" text-anchor="middle">Growth Models</text>
  <text x="1050" y="287" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">CAGR • Power Law</text>

  <!-- Drawdown Planning -->
  <rect x="785" y="320" width="170" height="70" rx="12" fill="rgba(20,241,149,0.15)" stroke="#14F195" stroke-width="1"/>
  <text x="870" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14F195" text-anchor="middle">Spend Planning</text>
  <text x="870" y="372" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Retirement Drawdown</text>

  <!-- Inflation Adjusted -->
  <rect x="965" y="320" width="170" height="70" rx="12" fill="rgba(153,69,255,0.15)" stroke="#9945FF" stroke-width="1"/>
  <text x="1050" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9945FF" text-anchor="middle">Real Returns</text>
  <text x="1050" y="372" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Inflation Adjusted</text>

  <!-- DCA Calculator -->
  <rect x="785" y="405" width="170" height="70" rx="12" fill="rgba(153,69,255,0.15)" stroke="#9945FF" stroke-width="1"/>
  <text x="870" y="435" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9945FF" text-anchor="middle">DCA Strategy</text>
  <text x="870" y="457" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Weekly • Monthly</text>

  <!-- Wallet Connect -->
  <rect x="965" y="405" width="170" height="70" rx="12" fill="rgba(20,241,149,0.15)" stroke="#14F195" stroke-width="1"/>
  <text x="1050" y="435" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14F195" text-anchor="middle">Wallet Connect</text>
  <text x="1050" y="457" font-family="Arial, sans-serif" font-size="12" fill="#888" text-anchor="middle">Solana Compatible</text>

  <!-- Bottom disclaimer -->
  <text x="600" y="565" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">For educational and entertainment purposes only. Not financial advice.</text>

  <!-- Version badge -->
  <rect x="1100" y="530" width="60" height="24" rx="12" fill="rgba(153,69,255,0.2)"/>
  <text x="1130" y="547" font-family="Arial, sans-serif" font-size="11" fill="#9945FF" text-anchor="middle">v2.0</text>
</svg>
