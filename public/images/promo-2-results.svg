<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0D0D0D"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14F195"/>
      <stop offset="100%" style="stop-color:#9945FF"/>
    </linearGradient>
    <linearGradient id="phoneFrame2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="50%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <filter id="phoneShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#14F195" flood-opacity="0.3"/>
    </filter>
    <clipPath id="screenClip2">
      <rect x="215" y="620" width="650" height="1150" rx="30"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg2)"/>

  <!-- Decorative elements -->
  <circle cx="980" cy="200" r="250" fill="#14F195" opacity="0.08"/>
  <circle cx="50" cy="1500" r="200" fill="#9945FF" opacity="0.1"/>

  <!-- Floating particles -->
  <circle cx="900" cy="500" r="4" fill="#14F195" opacity="0.6"/>
  <circle cx="180" cy="350" r="3" fill="#9945FF" opacity="0.5"/>
  <circle cx="850" cy="1350" r="5" fill="#14F195" opacity="0.4"/>
  <circle cx="230" cy="1200" r="4" fill="#9945FF" opacity="0.5"/>

  <!-- Header text -->
  <text x="540" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">Monte Carlo</text>
  <text x="540" y="240" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#accent2)" text-anchor="middle">Projections</text>

  <!-- Subtitle -->
  <text x="540" y="320" font-family="Arial, sans-serif" font-size="32" fill="#888888" text-anchor="middle">500+ simulations for realistic growth forecasts</text>

  <!-- Feature badges -->
  <rect x="140" y="380" width="240" height="50" rx="25" fill="rgba(20,241,149,0.2)" stroke="#14F195" stroke-width="2"/>
  <text x="260" y="415" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#14F195" text-anchor="middle">CAGR Model</text>

  <rect x="420" y="380" width="240" height="50" rx="25" fill="rgba(153,69,255,0.2)" stroke="#9945FF" stroke-width="2"/>
  <text x="540" y="415" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#9945FF" text-anchor="middle">Power Law</text>

  <rect x="700" y="380" width="240" height="50" rx="25" fill="rgba(20,241,149,0.2)" stroke="#14F195" stroke-width="2"/>
  <text x="820" y="415" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#14F195" text-anchor="middle">10-90% Range</text>

  <!-- Phone frame -->
  <g filter="url(#phoneShadow2)">
    <!-- Phone body -->
    <rect x="190" y="480" width="700" height="1340" rx="50" fill="url(#phoneFrame2)" stroke="#3a3a3a" stroke-width="2"/>

    <!-- Screen bezel -->
    <rect x="205" y="520" width="670" height="1260" rx="40" fill="#0a0a0a"/>

    <!-- Dynamic Island / Notch -->
    <rect x="440" y="535" width="200" height="35" rx="17" fill="#1a1a1a"/>

    <!-- Screenshot -->
    <image xlink:href="screenshot-2.png" x="215" y="580" width="650" height="1190" clip-path="url(#screenClip2)" preserveAspectRatio="xMidYMin slice"/>

    <!-- Home indicator -->
    <rect x="440" y="1755" width="200" height="6" rx="3" fill="#3a3a3a"/>
  </g>

  <!-- Bottom text -->
  <text x="540" y="1870" font-family="Arial, sans-serif" font-size="28" fill="#666" text-anchor="middle">For educational purposes only</text>
</svg>
